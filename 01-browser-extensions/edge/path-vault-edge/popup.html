<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Path-aware Password Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>应用级密码库</h1>
        <div id="versionText" class="version"></div>
        <button id="openChangelog" class="version-link">版本记录</button>
      </div>
      <div id="stateBadge" class="badge">加载中</div>
    </header>

    <label class="global-pause">
      <input id="pauseAutofill" type="checkbox">
      暂停所有页面自动填充
    </label>

    <label class="remember-unlock">
      <input id="rememberUnlock" type="checkbox">
      浏览器重启后自动解锁
    </label>

    <section id="message" class="message hidden"></section>

    <section id="setupView" class="hidden">
      <p class="warning">首次使用请设置主口令。主口令不会同步，丢失后无法恢复。</p>
      <label>
        主口令
        <input id="setupPassphrase" type="password" autocomplete="new-password" minlength="12">
      </label>
      <label>
        确认主口令
        <input id="setupConfirm" type="password" autocomplete="new-password" minlength="12">
      </label>
      <button id="createVault" class="primary">创建加密密码库</button>
    </section>

    <section id="unlockView" class="hidden">
      <label>
        主口令
        <input id="unlockPassphrase" type="password" autocomplete="current-password">
      </label>
      <button id="unlockVault" class="primary">解锁</button>
    </section>

    <section id="appView" class="hidden">
      <dl class="app-info">
        <div>
          <dt>主机</dt>
          <dd id="originText"></dd>
        </div>
        <div>
          <dt>应用路径</dt>
          <dd id="prefixText"></dd>
        </div>
        <div>
          <dt>应用标识</dt>
          <dd id="appKeyText"></dd>
        </div>
      </dl>

      <div class="row">
        <label class="inline">
          <input id="autoFillToggle" type="checkbox">
          打开页面自动填充
        </label>
        <label class="inline">
          路径层级
          <select id="depthSelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="inline">
          <input id="recordToggle" type="checkbox">
          提交时记录本应用（默认开启）
        </label>
      </div>

      <div class="actions">
        <button id="saveForm">保存当前表单</button>
        <button id="forceAutoFill">重新自动填充</button>
        <button id="diagnosePage">检测当前页面</button>
        <button id="lockNow">锁定</button>
        <button id="refresh">刷新</button>
      </div>

      <h2>当前应用记录</h2>
      <div id="entries" class="entries"></div>

      <section id="diagnosticPanel" class="hidden">
        <h2>页面检测结果</h2>
        <pre id="diagnosticOutput"></pre>
        <button id="copyDiagnostic">复制检测结果</button>
      </section>

      <h2>备份</h2>
      <div class="actions">
        <button id="exportVault">导出加密备份</button>
        <label class="file-button">
          导入备份
          <input id="importFile" type="file" accept="application/json,.json">
        </label>
      </div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
